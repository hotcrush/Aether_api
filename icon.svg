<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="glow" x1="256" y1="80" x2="256" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="accent" x1="256" y1="200" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Outer diamond shape -->
  <path d="M256 72L432 256L256 440L80 256Z" stroke="url(#glow)" stroke-width="18" stroke-linejoin="round" fill="none" opacity="0.3"/>
  <!-- Inner routing paths: one input splits to three outputs -->
  <path d="M256 380V280" stroke="url(#accent)" stroke-width="20" stroke-linecap="round"/>
  <path d="M256 280L168 168" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
  <path d="M256 280V148" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
  <path d="M256 280L344 168" stroke="url(#accent)" stroke-width="16" stroke-linecap="round"/>
  <!-- Node dots at endpoints -->
  <circle cx="256" cy="380" r="22" fill="#a5b4fc"/>
  <circle cx="168" cy="168" r="18" fill="#818cf8"/>
  <circle cx="256" cy="148" r="18" fill="#818cf8"/>
  <circle cx="344" cy="168" r="18" fill="#818cf8"/>
  <!-- Center junction glow -->
  <circle cx="256" cy="280" r="12" fill="#c7d2fe"/>
</svg>
